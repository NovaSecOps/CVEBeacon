services:
  scan:
    image: cvebeacon:local
    build:
      context: ../..
      target: core
    profiles: [scan]
    command: [--config, /config/cvebeacon.toml, scan, --report, json]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    volumes:
      - ./cvebeacon.toml:/config/cvebeacon.toml:ro
      - ./secrets:/config/secrets:ro
      - ./inventory:/inventory:ro
      - ./state:/state:rw
      - ./reports:/reports:rw
    stop_grace_period: 30s
  watch:
    image: cvebeacon:local
    build:
      context: ../..
      target: core
    profiles: [watch]
    command: [--config, /config/cvebeacon.toml, watch, run]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    env_file:
      - path: ./cvebeacon.env
        required: false
    volumes:
      - ./cvebeacon.toml:/config/cvebeacon.toml:ro
      - ./inventory:/inventory:ro
      - ./state:/state:rw
      - ./reports:/reports:rw
      # Optional file-based channel secrets. Docker creates a missing host
      # directory as root; secret files must be mode 0600 and owned by 65532.
      - ./secrets:/config/secrets:ro
    stop_grace_period: 30s
  run:
    image: cvebeacon:local
    build:
      context: ../..
      target: core
    profiles: [run]
    command: [--config, /config/cvebeacon.toml, run]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    env_file:
      - path: ./cvebeacon.env
        required: false
    volumes:
      - ./cvebeacon.toml:/config/cvebeacon.toml:ro
      - ./inventory:/inventory:ro
      - ./state:/state:rw
      - ./reports:/reports:rw
      # Optional file-based channel secrets. Docker creates a missing host
      # directory as root; secret files must be mode 0600 and owned by 65532.
      - ./secrets:/config/secrets:ro
    stop_grace_period: 30s
  dashboard:
    image: cvebeacon:local
    build:
      context: ../..
      target: core
    profiles: [dashboard]
    command: [--config, /config/cvebeacon.toml, serve, --host, 0.0.0.0]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    environment:
      - CVEBEACON_DASHBOARD_PASSWORD_HASH
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      # The configuration editor needs a writable configuration directory.
      # The read-only file mount below is the hardened default. To enable
      # editing, mount a directory instead for this service only:
      #   - ./config:/config:rw
      - ./cvebeacon.toml:/config/cvebeacon.toml:ro
      - ./secrets:/config/secrets:ro
      - ./inventory:/inventory:ro
      - ./state:/state:rw
      - ./reports:/reports:rw
    stop_grace_period: 30s
