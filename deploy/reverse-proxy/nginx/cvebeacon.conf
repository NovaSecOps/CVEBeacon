# CVEBeacon dashboard behind nginx.
#
# Install as /etc/nginx/conf.d/cvebeacon.conf, replace cvebeacon.example.com
# and the certificate paths, then check with `nginx -t` and reload nginx.
#
# The dashboard listens on loopback only:
#   cvebeacon --config /var/lib/cvebeacon/cvebeacon.toml serve
#
# It trusts no forwarded host, address or scheme headers, does not support a
# URL prefix, and checks the request Host header against the trusted hosts for
# its bind address. Keep the public hostname in server_name and send
# 127.0.0.1:8787 as the backend Host.

server {
    listen 80;
    listen [::]:80;
    server_name cvebeacon.example.com;
    server_tokens off;

    # Do not send visitors to the dashboard over plain HTTP.
    return 301 https://cvebeacon.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cvebeacon.example.com;

    ssl_certificate     /etc/ssl/cvebeacon/fullchain.pem;
    ssl_certificate_key /etc/ssl/cvebeacon/privkey.pem;

    # Mozilla intermediate TLS configuration: TLS 1.2 and 1.3 with ECDHE
    # ciphers. DHE suites are omitted so no separate dhparam file is needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # HSTS: add includeSubDomains only when every subdomain is served over
    # HTTPS, and preload only after the domain meets the preload list rules.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Keep ordinary requests at 6 MB. The nested client inventory upload
    # location raises that route to 34 MiB for 32 MiB files and multipart framing.
    client_max_body_size 6m;

    # /bootstrap accepts only loopback peers, and every request through this
    # proxy appears local. Create the first administrator with
    # `cvebeacon users add NAME --admin` before exposing the dashboard.
    location = /bootstrap {
        return 404;
    }

    # The updater probes the dashboard directly on loopback. Keep /healthz
    # private; expose a separate check deliberately for external uptime monitoring.
    location = /healthz {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Flask builds canonical redirects from the backend Host and HTTP
        # scheme. Rewrite them to the public origin, keeping the query string;
        # nginx expands the root-relative replacement against the request.
        proxy_redirect http://127.0.0.1:8787/ /;

        # The dashboard validates this Host header and ignores forwarded
        # headers, so send the backend address and clear client-supplied
        # forwarding headers.
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        # Manual queries and report generation can run for several minutes;
        # background jobs return immediately.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Inherit the other dashboard proxy settings while allowing the full
        # client inventory upload request.
        location ~ ^/watch/clients/[^/]+/upload$ {
            client_max_body_size 34m;
            # proxy_pass is not inherited by nested locations.
            proxy_pass http://127.0.0.1:8787;
        }
    }
}
