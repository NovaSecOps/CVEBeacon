{% extends 'base.html' %}
{% block title %}Log in · CVEBeacon{% endblock %}
{% block content %}
<h1>Dashboard login</h1>
{% if failed %}<p role="alert">Login unsuccessful. Wait before trying again.</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Password <input type="password" name="password" required maxlength="1024" autocomplete="current-password"></label>
<button type="submit">Log in</button>
</form>
{% endblock %}
