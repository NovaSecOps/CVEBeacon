name: Container validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Core OCI build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "Werkzeug>=3.1.9,<4"
      - run: docker compose -f deploy/container/compose.yml --profile scan --profile dashboard config --quiet
      - run: docker build --target core --tag cvebeacon:ci .
      - run: python tools/container_smoke.py
