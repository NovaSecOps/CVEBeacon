name: Automation Kubernetes validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes:
    name: Ephemeral v2 kind stages and scheduled scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "PyYAML>=6.0.2,<7"
      - name: Install pinned kind
        run: |
          curl --fail --location --silent --show-error --max-time 120 --output "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install matching pinned kubectl
        run: |
          curl --fail --location --silent --show-error --max-time 120 --output "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  $RUNNER_TEMP/kubectl" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/kubectl"
      - name: Build frozen Extensions collector image
        run: docker build --target extensions --tag cvebeacon-extensions:ci .
      - name: Build optional Automation image
        run: docker build --file automation/Dockerfile --tag cvebeacon-automation:ci .
      - name: Actual isolated cluster acceptance
        env:
          CVEBEACON_KUBERNETES_EVIDENCE: ${{ runner.temp }}/automation-kubernetes-evidence
        run: python automation/tools/kubernetes_acceptance.py
      - name: Preserve safe acceptance result and public subject bytes
        uses: actions/upload-artifact@v4
        with:
          name: automation-kubernetes-evidence
          path: ${{ runner.temp }}/automation-kubernetes-evidence
          if-no-files-found: error
          retention-days: 7
