name: Automation validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    name: Automation / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]" ./extensions ./automation
      - run: python -m pip check
      - run: python tools/test_offline.py -q automation/tests
      - run: cvebeacon-auto --help

  local-protocol:
    name: Automation / verified local HTTPS protocols
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install . ./extensions ./automation
      - run: python automation/tools/local_protocol.py
      - run: python automation/tools/local_notifications.py

  remote-discovery:
    name: Automation / native loopback SSH and Nmap
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends openssh-server nmap
      - run: python -m pip install . ./extensions ./automation
      - run: python automation/tools/native_remote_discovery.py

  registry:
    name: Automation / native TLS OCI Referrers
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install . ./extensions ./automation
      - run: python automation/tools/native_registry.py
        env:
          CVEBEACON_DISPOSABLE_CI: '1'

  container:
    name: Automation / separate hardened OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install . ./extensions ./automation
      - run: docker build --file automation/Dockerfile --tag cvebeacon-automation:ci .
      - run: python automation/tools/container_acceptance.py
