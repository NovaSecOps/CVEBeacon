[inventory]
# Include saved dashboard web observations (optional; false by default).
web_snapshots = false
path = "examples/inventory.csv"
format = "auto"
delimiter = ","
encoding = "utf-8-sig"

[inventory.columns]
asset_id = "asset_id"
vendor = "vendor"
product = "product"
version = "version"
# Optional: map the client label when the source has one.
# client = "client"

[state]
database = ".cvebeacon/state.db"

[output]
directory = "reports"

[http]
connect_timeout = 10
read_timeout = 30
retries = 3
backoff_seconds = 1
user_agent = "CVEBeacon/0.1"

[sources]
osv_enabled = true
nvd_enabled = true
cve_enabled = true
euvd_enabled = true
cisa_kev_enabled = true
eu_kev_enabled = true
epss_enabled = true
nvd_api_key_env = "NVD_API_KEY"
# nvd_api_key_file = "secrets/nvd-api-key"
minimum_request_interval = 6

# Optional change history. See docs/WATCH.md.
[watch]
enabled = false
database = "cvebeacon-watch.db"
sources = ["nvd", "euvd", "cisa_kev", "eu_kev", "epss"]
initial = "baseline"
backfill_days = 7
overlap_minutes = 15
# language = "en"               # en (default) or pt-PT

# Client-report identity: open (default), registered, or authenticated.
# See docs/WATCH.md for the users commands and password handling.
# [watch.reporting]
# identity = "open"

# Optional alert rules. Every channel named here must be configured below.
# [[watch.rules]]
# name = "critical-or-likely"
# condition = { any = [ { cvss_min = 9.0 }, { epss_min = 0.5 } ] }
# channels = ["soc-email"]

# Optional watch alert channels. See docs/WATCH.md for every channel type.
# [watch.channels.soc-email]
# type = "smtp"
# host = "smtp.example.invalid"
# port = 587
# security = "starttls"
# username = "alerts@example.invalid"
# password_env = "CVEBEACON_SMTP_PASSWORD"
# from = "alerts@example.invalid"
# to = ["security@example.invalid"]
# format = "html"               # text (default) or html

[notifications.teams]
enabled = false
webhook_env = "CVEBEACON_TEAMS_WEBHOOK_URL"

[notifications.email]
enabled = false
tenant_id_env = "CVEBEACON_M365_TENANT_ID"
client_id_env = "CVEBEACON_M365_CLIENT_ID"
client_secret_env = "CVEBEACON_M365_CLIENT_SECRET"
sender = "scanner@example.invalid"
recipients = ["security@example.invalid"]

# Optional exact product mapping. Verify the CPE before use.
# [[product_mappings]]
# vendor = "Example Vendor"
# product = "Example Product"
# cpe = "cpe:2.3:a:example:product:*:*:*:*:*:*:*:*"
