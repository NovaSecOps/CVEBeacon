[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvebeacon"
version = "0.1.0"
description = "Conservative vulnerability monitoring and lookup for product inventories"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "NovaSecOps" }]
maintainers = [{ name = "NovaSecOps" }]
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "packaging>=24,<27",
  "PyYAML>=6,<7",
  "Flask>=3.1.2,<4",
  "waitress>=3.0.2,<4",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
cvebeacon = "cvebeacon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvebeacon = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
